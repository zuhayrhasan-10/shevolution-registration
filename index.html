<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shevolution 2026 — Registration</title>
<meta name="description" content="Bangladesh Debating Council presents Shevolution 2026 at IUB. Register for Public Speaking, Art Competition, Slam Poetry, or Story Writing. #HearHerRoar">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Baloo+2:wght@600;700;800&family=Alex+Brush&family=EB+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">

<style>
  :root{
    --cream: #f2ead4;
    --cream-deep: #e9dfc0;
    --paper: #f7f1de;
    --ink: #1c1a17;
    --maroon: #8f2233;
    --maroon-deep: #6e1a27;
    --navy: #1f4d8f;
    --navy-deep: #163a6c;
    --gold: #c99a3a;
    --teal: #4f8f86;
    --line: rgba(28,26,23,0.14);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'EB Garamond', serif;
    position:relative;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* herringbone paper texture */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background-image:
      repeating-linear-gradient(135deg, rgba(143,34,51,0.05) 0 2px, transparent 2px 16px),
      repeating-linear-gradient(45deg, rgba(143,34,51,0.05) 0 2px, transparent 2px 16px);
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:760px;
    margin:0 auto;
    padding:64px 28px 40px;
  }

  /* ---------- floral doodles (original, simple SVG blooms) ---------- */
  .bloom{position:fixed; z-index:0; pointer-events:none; opacity:0.9;}
  .bloom svg{display:block; width:100%; height:100%;}
  .bloom-tl{top:-40px; left:-50px; width:170px; height:170px; transform:rotate(-8deg);}
  .bloom-tr{top:-30px; right:-45px; width:190px; height:190px; transform:rotate(12deg);}
  .bloom-br{bottom:-60px; right:-55px; width:230px; height:230px; transform:rotate(-6deg);}
  .bloom-bl{bottom:-50px; left:-40px; width:180px; height:180px; transform:rotate(10deg);}
  @media (max-width:640px){
    .bloom-tl{width:110px;height:110px;top:-24px;left:-30px;}
    .bloom-tr{width:120px;height:120px;top:-20px;right:-30px;}
    .bloom-br{width:150px;height:150px;bottom:-40px;right:-35px;}
    .bloom-bl{width:120px;height:120px;bottom:-30px;left:-25px;}
  }

  /* ---------- header ---------- */
  .titlecard{
    display:block;
    width:100%;
    height:auto;
    max-width:640px;
    margin:0 auto;
    border-radius:14px;
    box-shadow: 0 20px 40px -22px rgba(28,26,23,0.4);
  }

  .headline{
    text-align:center;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(1.5rem, 5.5vw, 2.35rem);
    color:var(--navy);
    -webkit-text-stroke:0.5px var(--navy-deep);
    margin:38px 0 8px;
    letter-spacing:.01em;
  }
  .headline-sub{
    text-align:center;
    font-family:'EB Garamond', serif;
    font-style:italic;
    color:#4a4638;
    font-size:1.05rem;
    margin-bottom:36px;
  }

  /* ---------- torn paper card ---------- */
  .card-wrap{
    position:relative;
    margin:0 auto 40px;
    max-width:560px;
  }
  .paperclip{
    position:absolute;
    top:-38px;
    right:14%;
    width:64px;
    height:100px;
    z-index:3;
    transform:rotate(8deg);
    filter:drop-shadow(0 3px 3px rgba(0,0,0,0.18));
  }
  @media (max-width:480px){ .paperclip{width:46px;height:72px;top:-26px;right:8%;} }

  .torn-card{
    position:relative;
    background:var(--paper);
    padding:38px 30px 32px;
    box-shadow: 0 18px 30px -18px rgba(28,26,23,0.35), 0 2px 0 rgba(255,255,255,0.4) inset;
  }
  .torn-card::before,
  .torn-card::after{
    content:"";
    position:absolute;
    left:0; right:0;
    height:16px;
    background:var(--paper);
  }
  .torn-card::before{
    top:-8px;
    clip-path: polygon(0% 100%,3% 30%,7% 90%,11% 20%,15% 80%,19% 10%,23% 70%,27% 25%,31% 95%,35% 15%,39% 75%,43% 30%,47% 85%,51% 20%,55% 70%,59% 10%,63% 90%,67% 25%,71% 80%,75% 15%,79% 70%,83% 30%,87% 95%,91% 20%,95% 80%,100% 100%);
  }
  .torn-card::after{
    bottom:-8px;
    clip-path: polygon(0% 0%,3% 70%,7% 10%,11% 80%,15% 20%,19% 90%,23% 30%,27% 75%,31% 5%,35% 85%,39% 25%,43% 70%,47% 15%,51% 80%,55% 30%,59% 90%,63% 10%,67% 75%,71% 20%,75% 85%,79% 30%,83% 70%,87% 5%,91% 80%,95% 20%,100% 0%);
  }

  .segments{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .segment{
    display:flex;
  }
  .seg-btn{
    flex:1;
    display:flex;
    align-items:baseline;
    gap:12px;
    text-decoration:none;
    padding:14px 18px;
    border:2px solid var(--maroon);
    background:transparent;
    color:var(--maroon);
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:1.08rem;
    letter-spacing:.01em;
    transition: background .18s ease, color .18s ease, transform .12s ease, box-shadow .18s ease;
    position:relative;
  }
  .seg-btn .num{
    font-family:'Playfair Display', serif;
    font-weight:900;
    font-size:1.05rem;
    color:var(--gold);
    min-width:1.4em;
  }
  .seg-btn .arrow{
    margin-left:auto;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    transition: transform .18s ease;
  }
  .seg-btn:hover{
    background:var(--maroon);
    color:var(--paper);
    transform:translateY(-2px);
    box-shadow:0 10px 18px -10px rgba(111,26,39,0.55);
  }
  .seg-btn:hover .num{color:var(--gold);}
  .seg-btn:hover .arrow{transform:translateX(4px);}
  .seg-btn:focus-visible{
    outline:3px solid var(--navy);
    outline-offset:3px;
  }
  .seg-btn:active{transform:translateY(0);}

  /* ---------- footer ---------- */
  .hashtag{
    text-align:center;
    font-family:'Alex Brush', cursive;
    color:var(--maroon);
    font-size:clamp(2.2rem, 8vw, 3rem);
    margin:6px 0 4px;
  }
  .presented-by{
    text-align:center;
    font-family:'EB Garamond', serif;
    font-size:0.92rem;
    color:#5c5849;
    letter-spacing:.03em;
  }

  footer.credit{
    text-align:center;
    font-family:'EB Garamond', serif;
    font-size:0.8rem;
    color:#8a8570;
    margin-top:30px;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

<div class="bloom bloom-tl">
  <svg viewBox="0 0 100 100">
    <g transform="translate(52,48)">
      <g fill="#c94b4b" opacity="0.88">
        <ellipse rx="12" ry="20" transform="rotate(0) translate(0,-20)"/>
        <ellipse rx="12" ry="20" transform="rotate(72) translate(0,-20)"/>
        <ellipse rx="12" ry="20" transform="rotate(144) translate(0,-20)"/>
        <ellipse rx="12" ry="20" transform="rotate(216) translate(0,-20)"/>
        <ellipse rx="12" ry="20" transform="rotate(288) translate(0,-20)"/>
      </g>
      <circle r="11" fill="#8a6a2e"/>
      <circle r="11" fill="none" stroke="#5c4a1e" stroke-width="1" stroke-dasharray="2 3"/>
    </g>
  </svg>
</div>

<div class="bloom bloom-tr">
  <svg viewBox="0 0 100 100">
    <g transform="translate(55,52)">
      <g fill="#e0a83e" opacity="0.88">
        <ellipse rx="11" ry="18" transform="rotate(0) translate(0,-18)"/>
        <ellipse rx="11" ry="18" transform="rotate(60) translate(0,-18)"/>
        <ellipse rx="11" ry="18" transform="rotate(120) translate(0,-18)"/>
        <ellipse rx="11" ry="18" transform="rotate(180) translate(0,-18)"/>
        <ellipse rx="11" ry="18" transform="rotate(240) translate(0,-18)"/>
        <ellipse rx="11" ry="18" transform="rotate(300) translate(0,-18)"/>
      </g>
      <circle r="9" fill="#7a5c3e"/>
    </g>
  </svg>
</div>

<div class="bloom bloom-br">
  <svg viewBox="0 0 100 100">
    <g transform="translate(50,52)">
      <g fill="#4f8f86" opacity="0.88">
        <ellipse rx="14" ry="22" transform="rotate(0) translate(0,-22)"/>
        <ellipse rx="14" ry="22" transform="rotate(90) translate(0,-22)"/>
        <ellipse rx="14" ry="22" transform="rotate(180) translate(0,-22)"/>
        <ellipse rx="14" ry="22" transform="rotate(270) translate(0,-22)"/>
      </g>
      <circle r="12" fill="#8f2233"/>
    </g>
    <g transform="translate(50,52) rotate(45)">
      <g fill="#6fb0a6" opacity="0.55">
        <ellipse rx="10" ry="16" transform="rotate(0) translate(0,-16)"/>
        <ellipse rx="10" ry="16" transform="rotate(90) translate(0,-16)"/>
        <ellipse rx="10" ry="16" transform="rotate(180) translate(0,-16)"/>
        <ellipse rx="10" ry="16" transform="rotate(270) translate(0,-16)"/>
      </g>
    </g>
  </svg>
</div>

<div class="bloom bloom-bl">
  <svg viewBox="0 0 100 100">
    <g transform="translate(46,50)">
      <g fill="#c85a6b" opacity="0.88">
        <ellipse rx="12" ry="19" transform="rotate(0) translate(0,-19)"/>
        <ellipse rx="12" ry="19" transform="rotate(72) translate(0,-19)"/>
        <ellipse rx="12" ry="19" transform="rotate(144) translate(0,-19)"/>
        <ellipse rx="12" ry="19" transform="rotate(216) translate(0,-19)"/>
        <ellipse rx="12" ry="19" transform="rotate(288) translate(0,-19)"/>
      </g>
      <circle r="10" fill="#5c7a5e"/>
    </g>
  </svg>
</div>

<div class="wrap">

  <img class="titlecard" src="assets/titlecard.png" alt="Independent University, Bangladesh presents Bangladesh Debating Council: Shevolution 2026. #HearHerRoar. August 28-30, 2026.">

  <h2 class="headline">Introducing Ancillary Segments</h2>
  <p class="headline-sub">Pick your segment and register below</p>

  <div class="card-wrap">
    <div class="paperclip" aria-hidden="true">
      <svg viewBox="0 0 40 70" fill="none" stroke="#a15a1f" stroke-width="5" stroke-linecap="round">
        <path d="M12 8 v38 a8 8 0 0 0 16 0 v-30 a5 5 0 0 0 -10 0 v28"/>
      </svg>
    </div>
    <div class="torn-card">
      <ul class="segments">
        <li class="segment">
          <a class="seg-btn" href="https://forms.gle/RBzQg76LXumoArgw9" target="_blank" rel="noopener">
            <span class="num">1.</span> Public Speaking <span class="arrow">→</span>
          </a>
        </li>
        <li class="segment">
          <a class="seg-btn" href="https://forms.gle/2UhyELSfGSzKmTW67" target="_blank" rel="noopener">
            <span class="num">2.</span> Art Competition <span class="arrow">→</span>
          </a>
        </li>
        <li class="segment">
          <a class="seg-btn" href="https://forms.gle/aYsaBon8wTxFNjc99" target="_blank" rel="noopener">
            <span class="num">3.</span> Slam Poetry <span class="arrow">→</span>
          </a>
        </li>
        <li class="segment">
          <a class="seg-btn" href="https://forms.gle/VfktTxrGMAdppUmL8" target="_blank" rel="noopener">
            <span class="num">4.</span> Story Writing <span class="arrow">→</span>
          </a>
        </li>
      </ul>
    </div>
  </div>

  <p class="presented-by">IUB Debate Club · Registration Portal</p>

  <footer class="credit">Shevolution 2026 — Bangladesh Debating Council × IUB</footer>
</div>

</body>
</html>
